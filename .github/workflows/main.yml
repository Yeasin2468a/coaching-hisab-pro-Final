name: Build Coaching Hisab Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 👇 এই স্টেপটি gradlew অটো তৈরি করবে
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      # 👇 এখন chmod কাজ করবে কারণ gradlew তৈরি হয়েছে
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 👇 Build APK
      - name: Build APK
        run: ./gradlew assembleRelease

      # 👇 APK আপলোড
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Coaching-Hisab-Pro
          path: app/build/outputs/apk/release/*.apkapk
